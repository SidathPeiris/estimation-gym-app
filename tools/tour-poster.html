<style>
  /* The brand faces, from the repo rather than a CDN so a render is
     reproducible offline and always uses the shipped type. font-display:
     block, not swap: a headless screenshot must never capture the fallback. */
  @font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:400 800;font-display:block;src:url("../fonts/bricolage-grotesque-latin.woff2") format("woff2")}
  @font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400 700;font-display:block;src:url("../fonts/schibsted-grotesk-latin.woff2") format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 700;font-display:block;src:url("../fonts/jetbrains-mono-latin.woff2") format("woff2")}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:540px;height:960px;overflow:hidden}
 body{background:linear-gradient(165deg,#232840,#171a27);display:grid;place-items:center;
   font-family:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;color:#c0caf5}
 .in{text-align:center}
 .mark{position:relative;width:190px;height:190px;margin:0 auto 40px}
 .mark i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:block}
 .m1{width:190px;height:190px;border:17px solid #414868}
 .m2{width:126px;height:126px;border:17px solid #5872ae}
 .m3{width:50px;height:50px;background:#7aa2f7}
 h1{font-family:"Bricolage Grotesque","Segoe UI Variable Display",system-ui,sans-serif;font-size:44px;letter-spacing:-1px}
 p{margin-top:18px;font-size:25px;color:#7681a8}
 .play{margin:46px auto 0;width:96px;height:96px;border-radius:50%;background:#7aa2f7;
   display:grid;place-items:center;color:#1a1b26;font-size:34px;padding-left:7px}
</style>
<div class="in">
  <div class="mark"><i class="m1"></i><i class="m2"></i><i class="m3"></i></div>
  <h1>Fifty seconds</h1>
  <p>a guess, scored,<br>start to finish</p>
  <div class="play">&#9654;</div>
</div>
