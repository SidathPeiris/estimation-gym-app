<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1b26">
<meta name="description" content="A daily Fermi-estimation puzzle, scored on order-of-magnitude closeness.">
<title>Estimation Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estimation Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="app">
  <header class="hero">
    <h1>Estimation Gym</h1>
    <span class="puzzle" id="puzzle">—</span>
  </header>
  <p class="streak" id="streak">Streak 0 · Best 0</p>

  <p class="asof" id="asof" hidden></p>
  <p class="prompt" id="prompt">Loading…</p>

  <form class="guess" id="guess-form" novalidate>
    <input
      id="guess-input"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Your estimate">
    <button type="button" id="exp" aria-label="Insert scientific notation, times ten to the power"
            title="Scientific notation: 3 ×10ⁿ 12 is 3e12">&times;10<sup>n</sup></button>
    <button type="submit" id="guess-go">Go</button>
  </form>
  <p class="error" id="error" role="alert" hidden></p>

  <button type="button" class="hint-toggle" id="hint-toggle" hidden>
    <span class="stats-title">&#9656; Hint</span>
    <span class="stats-summary">scores half points</span>
  </button>

  <section class="strategy" id="strategy" hidden>
    <p class="strategy-label" id="strategy-label"></p>
    <p class="strategy-guidance" id="strategy-guidance"></p>
  </section>

  <section class="result" id="result" hidden>
    <div class="result-head">
      <span class="band" id="band"></span>
      <span class="points" id="points"></span>
    </div>
    <p class="line" id="guess-line"></p>
    <p class="line" id="actual-line"></p>
    <p class="decades" id="decades-line"></p>
  </section>

  <section class="dist" id="dist" hidden>
    <div class="dist-head">
      <span class="dist-title">How everyone did</span>
      <span class="dist-summary" id="dist-summary"></span>
    </div>
    <div id="dist-bars"></div>
    <p class="dist-note" id="dist-note" hidden></p>
  </section>

  <button type="button" class="share" id="share" hidden>Share result</button>

  <p class="strategy-label" id="approach" hidden></p>
  <p class="hint" id="hint" hidden></p>
  <p class="source" id="source" hidden></p>

  <section class="howto" id="howto">
    <button class="stats-toggle" id="howto-toggle" aria-expanded="false" aria-controls="howto-body">
      <span class="stats-title"><span class="chev" id="howto-chev">&#9656;</span> How to play</span>
    </button>
    <div class="stats-body" id="howto-body" hidden>
      <ol class="howto-steps" id="howto-steps"></ol>
      <p class="howto-intro" id="howto-intro"></p>
      <table class="howto-scoring"><tbody id="howto-scoring"></tbody></table>
      <div id="howto-notes"></div>
    </div>
  </section>

  <section class="history" id="history" hidden>
    <button class="stats-toggle" id="history-toggle" aria-expanded="false" aria-controls="history-body">
      <span class="stats-title"><span class="chev" id="history-chev">▸</span> History</span>
      <span class="stats-summary" id="history-summary"></span>
    </button>
    <div class="stats-body" id="history-body" hidden>
      <ol class="history-list" id="history-list"></ol>
      <button type="button" class="export" id="history-more" hidden>Show all</button>
    </div>
  </section>

  <section class="stats" id="stats" hidden>
    <button class="stats-toggle" id="stats-toggle" aria-expanded="false" aria-controls="stats-body">
      <span class="stats-title"><span class="chev" id="chev">▸</span> Stats</span>
      <span class="stats-summary" id="stats-summary"></span>
    </button>
    <div class="stats-body" id="stats-body" hidden>
      <div id="bars"></div>
      <p class="stats-footer" id="stats-footer"></p>
      <p class="calibration" id="calibration" hidden></p>

      <section class="arch" id="arch" hidden>
        <p class="arch-headline" id="arch-headline" hidden></p>
        <div id="arch-rows"></div>
        <p class="arch-note" id="arch-note" hidden></p>
      </section>
      <button type="button" class="export" id="export">Copy my history</button>
      <button type="button" class="export" id="restore-toggle">Restore a history</button>
      <div id="restore-panel" hidden>
        <p class="restore-help">Paste a history you copied from another device. Days already
          on this device are kept as they are, so this can only add days back.</p>
        <textarea id="restore-input" class="restore-input" rows="4" spellcheck="false"
          placeholder="Paste the copied history here"></textarea>
        <button type="button" class="export" id="restore-go">Restore</button>
        <p class="restore-note" id="restore-note" hidden></p>
      </div>
    </div>
  </section>

  <button type="button" class="remind" id="remind" hidden>
    <span class="remind-label">Daily reminder</span>
    <span class="remind-state" id="remind-state">Off</span>
  </button>
  <p class="remind-note" id="remind-note" hidden></p>

  <p class="suggest">
    Got a good question for the bank?
    <a href="https://github.com/SidathPeiris/estimation-gym-omarchy/issues/new?template=suggest-a-question.yml"
       target="_blank" rel="noopener noreferrer">Suggest one</a>
    <span class="suggest-caveat">(needs a GitHub account)</span>
  </p>

  <p class="build" id="build"></p>
</main>

<script src="core/Model.js"></script>
<script src="core/questions.js"></script>
<script src="presenter.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
