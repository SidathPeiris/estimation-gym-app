name = "estimation-gym-distribution"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Created with:
#   npx wrangler d1 create estimation-gym
# then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "estimation-gym"
database_id = "9f7deb91-5df5-41a0-9477-309d71e010cf"

# The app's origin. Requests from anywhere else are refused, so the endpoint is
# not trivially usable as someone else's free counter.
[vars]
# Both are live while people reinstall on the new domain. The old one comes
# out once the subscriptions and installs have moved across.
ALLOWED_ORIGIN = "https://estimationgym.app,https://sidathpeiris.github.io"

# The VAPID public key is meant to be public - the browser is given it when it
# subscribes. The matching private key is a secret, set with:
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BHoIQ7xp8tGkF9-AoMc9_uN7e610XZ1GxXCYjk495Z_CBLeHO0YZIk0OjXgFn8bxs1mvxY5dANO6XDjN8BDdEZ0"

# Identifies the sender to the push service. An https URL is allowed by the
# spec and avoids publishing an email address in a public repo.
VAPID_SUBJECT = "https://estimationgym.app/"
# Hourly. Each run reminds only the subscribers for whom it has just turned
# 9am locally, so one schedule covers every timezone.
[triggers]
crons = ["0 * * * *"]


# Retains what the Worker logs so a cron run can be checked after the fact.
#
# Without this, console.log goes nowhere unless someone happens to be running
# `wrangler tail` at that moment - which is no use for a job that fires at 9am
# local and is the one part of the reminder system that has never been
# observed working. The scheduled() handler already reports how many
# subscribers were due and how many dead endpoints it removed; this is what
# makes that readable tomorrow morning instead of inferred from the database.
#
# head_sampling_rate = 1 logs every invocation. The cron runs hourly and the
# endpoints see very little traffic, so there is nothing to sample down.
[observability]
enabled = true
head_sampling_rate = 1
