<script type="text/babel">
const { Button, IconButton, ExponentButton, GuessField, TextField } = window.EstimationGymDesignSystem_4a01b0;
function Demo() {
  const [v, setV] = React.useState('2.4e4');
  return (
    <div>
      <div className="row">
        <Button variant="soft" size="lg">Go</Button>
        <Button variant="solid">Play today's question</Button>
        <Button variant="quiet" size="sm" icon="copy">Copy my history</Button>

      </div>
      <GuessField value={v} onChange={setV} unit="bacteria" />

        <TextField label="Question" placeholder="How many bricks are in the Great Wall of China?" />
        <TextField label="Answer" numeric placeholder="3.9e9" trailing={<ExponentButton />} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
