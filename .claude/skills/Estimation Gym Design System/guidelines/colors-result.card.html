<!-- @dsCard group="Colors" viewport="700x135" name="Result & personal" subtitle="The two numbers on a result, plus streak and reminder" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:132px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body>
<div class="wrap">
<div class="sw"><b style="color:var(--result-guess);font-family:var(--font-mono)">24,000</b><code>--result-guess</code></div>
<div class="sw"><b style="color:var(--result-actual);font-family:var(--font-mono)">17,000</b><code>--result-actual</code></div>
<div class="sw"><b style="color:var(--streak-best)">Best 14</b><code>--streak-best</code></div>
<div class="sw"><b style="color:var(--reminder-bell)">Reminder on</b><code>--reminder-bell</code></div>
</div>
<p style="margin-top:12px;font-size:var(--text-xs);color:var(--text-muted)">Outside the band hues: your guess against the true value, and the two personal markers that are not part of a score.</p>
</body></html>
