<!-- @dsCard group="Brand" viewport="700x125" name="Elevation & rings" subtitle="Hairline borders first; two low lifts, the focus ring, the band glow" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div class="wrap" style="gap:14px">
<div style="width:150px;height:84px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);display:grid;place-items:center;font-size:var(--text-xs);color:var(--text-muted)">hairline only</div>
<div style="width:150px;height:84px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);display:grid;place-items:center;font-size:var(--text-xs);color:var(--text-muted)">--shadow-card</div>
<div style="width:150px;height:84px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--shadow-raised);display:grid;place-items:center;font-size:var(--text-xs);color:var(--text-muted)">--shadow-raised</div>
<div style="width:150px;height:84px;background:var(--surface-card);border:1px solid var(--border-focus);border-radius:var(--radius-lg);box-shadow:var(--ring-focus);display:grid;place-items:center;font-size:var(--text-xs);color:var(--accent)">--ring-focus</div>
</div></body></html>
