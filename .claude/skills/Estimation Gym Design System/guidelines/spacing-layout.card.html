<!-- @dsCard group="Spacing" viewport="700x135" name="Layout column" subtitle="640px app column, 34rem prose column, 20px side padding" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div style="position:relative;height:96px;border:1px dashed var(--border-default);border-radius:var(--radius-md)">
  <div style="position:absolute;inset:0;margin:0 auto;width:min(640px,100%);background:color-mix(in srgb, var(--accent) 10%, transparent);border-left:1px solid var(--accent-edge);border-right:1px solid var(--accent-edge)"></div>
  <div style="position:absolute;inset:0;margin:0 auto;width:min(34rem,100%);background:color-mix(in srgb, var(--mode-practice) 10%, transparent)"></div>
  <div style="position:absolute;inset:auto 0 8px;text-align:center;font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)">--app-max 640px · --prose-max 34rem</div>
</div></body></html>
