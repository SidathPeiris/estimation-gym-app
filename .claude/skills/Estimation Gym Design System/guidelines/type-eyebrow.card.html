<!-- @dsCard group="Type" viewport="700x165" name="Eyebrows & labels" subtitle="Uppercase letterspaced labels, and the bold section title" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><p style="font:var(--type-eyebrow);font-size:var(--text-xs);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--text-muted)">as of 2025</p>
<p style="margin-top:8px;font:var(--type-eyebrow);font-size:var(--text-2xs);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--accent);font-weight:600">science &amp; nature</p>
<p style="margin-top:10px;font:var(--type-label);font-size:var(--text-base);color:var(--text-display)">How to play</p>
<p style="margin-top:4px;font-size:var(--text-sm);color:var(--text-muted)">doesn't affect your streak</p>
<p style="margin-top:10px;font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-faint)">--track-eyebrow 1.4px · --track-label .08em · summaries stay lowercase, no full stop</p></body></html>
