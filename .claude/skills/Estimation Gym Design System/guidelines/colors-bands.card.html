<!-- @dsCard group="Colors" viewport="700x135" name="Scoring bands" subtitle="One hue per band — the redesign splits the source’s shared blue" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div class="wrap">
<div class="sw" style="background:color-mix(in srgb, var(--band-bullseye) 14%, transparent);border-color:color-mix(in srgb, var(--band-bullseye) 45%, transparent)"><b style="color:var(--band-bullseye)">Bullseye</b><code>--band-bullseye</code></div>
<div class="sw" style="background:color-mix(in srgb, var(--band-close) 14%, transparent);border-color:color-mix(in srgb, var(--band-close) 45%, transparent)"><b style="color:var(--band-close)">Close</b><code>--band-close</code></div>
<div class="sw" style="background:color-mix(in srgb, var(--band-ballpark) 14%, transparent);border-color:color-mix(in srgb, var(--band-ballpark) 45%, transparent)"><b style="color:var(--band-ballpark)">Ballpark</b><code>--band-ballpark</code></div>
<div class="sw" style="background:color-mix(in srgb, var(--band-off) 14%, transparent);border-color:color-mix(in srgb, var(--band-off) 45%, transparent)"><b style="color:var(--band-off)">Off</b><code>--band-off</code></div>
</div>
<p style="margin-top:12px;font-size:var(--text-xs);color:var(--text-muted)">Bands are fills at 14% with a 45% border, never solid — the source's own recipe.</p></body></html>
