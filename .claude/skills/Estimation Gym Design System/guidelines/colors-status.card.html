<!-- @dsCard group="Colors" viewport="700x105" name="Status" subtitle="Urgent, good, warn, info — the four Tokyo Night signals" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div class="wrap">
<div class="sw" style="border-color:color-mix(in srgb, var(--status-urgent) 45%, transparent)"><b style="color:var(--status-urgent)">Urgent</b><code>#f7768e</code></div>
<div class="sw" style="border-color:color-mix(in srgb, var(--status-good) 45%, transparent)"><b style="color:var(--status-good)">Good</b><code>#9ece6a</code></div>
<div class="sw" style="border-color:color-mix(in srgb, var(--status-warn) 45%, transparent)"><b style="color:var(--status-warn)">Warn</b><code>#e0af68</code></div>
<div class="sw" style="border-color:color-mix(in srgb, var(--status-info) 45%, transparent)"><b style="color:var(--status-info)">Info</b><code>#7dcfff</code></div>
</div></body></html>
