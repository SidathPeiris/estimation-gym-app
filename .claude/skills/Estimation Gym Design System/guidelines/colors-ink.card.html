<!-- @dsCard group="Colors" viewport="700x190" name="Text" subtitle="Four weights of ink on the page ground, plus the on-accent inverse" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div style="display:grid;gap:8px">
<div style="font:var(--type-title);font-size:var(--text-xl);color:var(--text-display)">Display — #e8edff <span style="font:var(--type-body);font-size:var(--text-xs);color:var(--text-muted)">--text-display</span></div>
<div style="font-size:var(--text-md);color:var(--text-body)">Body — #c0caf5 <span style="font-size:var(--text-xs);color:var(--text-muted)">--text-body</span></div>
<div style="font-size:var(--text-base);color:var(--text-secondary)">Secondary — #8d96b8 <span style="font-size:var(--text-xs);color:var(--text-muted)">--text-secondary</span></div>
<div style="font-size:var(--text-sm);color:var(--text-muted)">Muted — #7681a8 &nbsp;·&nbsp; <span style="color:var(--text-faint)">Faint — #565f89 (--text-faint)</span></div>
<div style="display:inline-block;background:var(--accent);color:var(--text-on-accent);padding:4px 10px;border-radius:var(--radius-md);font:var(--type-label);font-size:var(--text-sm);width:max-content">On accent — --text-on-accent</div>
</div></body></html>
