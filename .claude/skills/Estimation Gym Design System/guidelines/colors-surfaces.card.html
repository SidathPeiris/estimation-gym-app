<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="The ink ramp: page ground, cards, raised panels, hairlines" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div class="wrap">
<div class="sw" style="background:var(--surface-page);color:var(--text-display)"><b>Page</b><code>--surface-page</code></div>
<div class="sw" style="background:var(--surface-card);color:var(--text-display)"><b>Card</b><code>--surface-card</code></div>
<div class="sw" style="background:var(--surface-raised);color:var(--text-display)"><b>Raised</b><code>--surface-raised</code></div>
<div class="sw" style="background:var(--surface-sunken);color:var(--text-display)"><b>Sunken</b><code>--surface-sunken</code></div>
<div class="sw" style="background:var(--border-default)"><b style="color:var(--text-display)">Line</b><code>--border-default</code></div>
<div class="sw" style="background:var(--border-strong)"><b style="color:var(--text-display)">Line strong</b><code>--border-strong</code></div>
</div></body></html>
