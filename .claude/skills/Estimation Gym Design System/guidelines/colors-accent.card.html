<!-- @dsCard group="Colors" viewport="700x105" name="Accent" subtitle="The brand blue and its ring tones, straight from the bullseye mark" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div class="wrap">
<div class="sw" style="background:var(--accent);color:var(--text-on-accent)"><b>Accent</b><code>#7aa2f7</code></div>
<div class="sw" style="background:var(--accent-hover);color:var(--text-on-accent)"><b>Hover</b><code>#9fbdff</code></div>
<div class="sw" style="background:var(--accent-deep);color:var(--text-display)"><b>Deep ring</b><code>#5872ae</code></div>
<div class="sw" style="background:var(--accent-ring);color:var(--text-display)"><b>Outer ring</b><code>#414868</code></div>
<div class="sw" style="background:var(--accent-wash);border-color:var(--accent-edge);color:var(--accent)"><b>Wash 16%</b><code>--accent-wash</code></div>
</div></body></html>
