<!-- @dsCard group="Brand" viewport="700x175" name="Motion" subtitle="Short, eased-out, and only on things that just arrived" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;font:var(--type-body)}.wrap{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:var(--radius-md);border:1px solid var(--border-default);padding:10px 12px;min-width:108px}.sw b{display:block;font:var(--type-label);font-size:var(--text-sm);color:var(--text-display)}.sw code{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}</style>
</head><body><div style="display:grid;gap:6px;font-size:var(--text-sm);color:var(--text-body)">
<div><code style="font-family:var(--font-mono);color:var(--accent)">140ms</code> --dur-fast · control hovers, chevron turn</div>
<div><code style="font-family:var(--font-mono);color:var(--accent)">220ms</code> --dur-base · disclosure open, result pop (spring)</div>
<div><code style="font-family:var(--font-mono);color:var(--accent)">360ms</code> --dur-slow · bars growing from the left</div>
<div><code style="font-family:var(--font-mono);color:var(--accent)">520ms</code> --dur-reveal · today's card rising in</div>
<div style="margin-top:4px;color:var(--text-muted);font-size:var(--text-xs)">Press is the source's 1px nudge down, never a scale. Reduced motion zeroes every duration.</div>
</div></body></html>
