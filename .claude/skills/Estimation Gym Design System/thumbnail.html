<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
body{width:1280px;height:854px;display:flex;background:var(--surface-page);overflow:hidden}
.main{flex:1;display:grid;place-items:center;background:#1a1b26;position:relative}
.main .wash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, rgba(122,162,247,.16) 0%, rgba(122,162,247,.05) 42%, rgba(122,162,247,0) 72%)}
.lock{position:relative;text-align:center}
.lock img{display:block;margin:0 auto 44px;width:230px;height:230px}
.lock span{font-family:var(--font-display);font-weight:700;font-size:112px;line-height:1;letter-spacing:-.03em;color:#e8edff;white-space:nowrap}
.lock span i{font-style:normal;color:#7aa2f7}
.strip{width:236px;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head><body>
<div class="main"><div class="wash"></div>
<div class="lock"><img src="assets/logo.svg" alt=""><span>Estimation <i>Gym</i></span></div>
</div>
<div class="strip">
<i style="background:#9ece6a"></i>
<i style="background:#e0af68"></i>
<i style="background:#7aa2f7"></i>
<i style="background:#f7768e"></i>
</div>
</body></html>
